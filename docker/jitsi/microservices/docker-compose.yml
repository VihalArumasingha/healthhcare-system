version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: healthcare-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: healthcare
    volumes:
      - mongodb_data:/data/db
    networks:
      - healthcare-network

  # Auth Service
  auth-service:
    build:
      context: ../../../auth-service
      dockerfile: Dockerfile
    container_name: healthcare-auth-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/authservice
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_here_change_in_production}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
    depends_on:
      - mongodb
    networks:
      - healthcare-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health || true"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Doctor Service
  doctor-service:
    build:
      context: ../../../doctor-service
      dockerfile: Dockerfile
    container_name: healthcare-doctor-service
    restart: unless-stopped
    ports:
      - "5004:5004"
    environment:
      PORT: 5004
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/doctorservice
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_here_change_in_production}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
    depends_on:
      - mongodb
      - auth-service
    networks:
      - healthcare-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/health || true"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Appointment Service
  appointment-service:
    build:
      context: ../../../appointment-service
      dockerfile: Dockerfile
    container_name: healthcare-appointment-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      PORT: 5002
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/appointmentdb
      DOCTOR_SERVICE_URL: http://healthcare-doctor-service:5004/api/doctors
      NOTIFICATION_SERVICE_URL: http://healthcare-notification-service:5006/api/notifications
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_here_change_in_production}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      - mongodb
      - doctor-service
      - auth-service
    networks:
      - healthcare-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health || true"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Payment Service
  payment-service:
    build:
      context: ../../../payment-service
      dockerfile: Dockerfile
    container_name: healthcare-payment-service
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      PORT: 5005
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/payment_db
      APPOINTMENT_SERVICE_URL: http://healthcare-appointment-service:5002/api/appointments
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_your_key_here}
    depends_on:
      - mongodb
      - appointment-service
    networks:
      - healthcare-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/health || true"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Notification Service
  notification-service:
    build:
      context: ../../../notification-service
      dockerfile: Dockerfile
    container_name: healthcare-notification-service
    restart: unless-stopped
    ports:
      - "5006:5006"
    environment:
      PORT: 5006
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/notificationdb
    depends_on:
      - mongodb
    networks:
      - healthcare-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5006/health || true"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Patient Service
  patient-service:
    build:
      context: ../../../patient-service
      dockerfile: Dockerfile
    container_name: healthcare-patient-service
    restart: unless-stopped
    ports:
      - "5003:5003"
    environment:
      PORT: 5003
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/patientdb
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      - mongodb
    networks:
      - healthcare-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health || true"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Telemedicine Service
  telemedicine-service:
    build:
      context: ../../../telemedicine-service
      dockerfile: Dockerfile
    container_name: healthcare-telemedicine-service
    restart: unless-stopped
    ports:
      - "5007:5007"
    environment:
      TELEMEDICINE_SERVICE_PORT: 5007
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/telemedicinedb
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
    depends_on:
      - mongodb
    networks:
      - healthcare-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5007/health || true"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:
    driver: local

networks:
  healthcare-network:
    driver: bridge

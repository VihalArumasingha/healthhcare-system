version: "3.8"

services:
  web:
    image: jitsi/web:stable
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - "${CONFIG:-./config}/web:/config"
      - "${CONFIG:-./config}/web/letsencrypt:/etc/letsencrypt"
    environment:
      - TZ=${TZ:-UTC}
      - PUBLIC_URL=https://${JITSI_DOMAIN}
      - ENABLE_AUTH=1
      - AUTH_TYPE=jwt
      - ENABLE_GUESTS=0
      - ENABLE_LETSENCRYPT=0
      - LETSENCRYPT_DOMAIN=${JITSI_DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - XMPP_DOMAIN=${JITSI_DOMAIN}
      - XMPP_AUTH_DOMAIN=auth.${JITSI_DOMAIN}
      - XMPP_GUEST_DOMAIN=guest.${JITSI_DOMAIN}
      - XMPP_MUC_DOMAIN=muc.${JITSI_DOMAIN}
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.${JITSI_DOMAIN}
      - XMPP_BOSH_URL_BASE=http://prosody:5280
      - XMPP_SERVER=prosody
      - JWT_APP_ID=${JITSI_APP_ID}
      - JWT_APP_SECRET=${JITSI_APP_SECRET}
      - JWT_ACCEPTED_ISSUERS=${JITSI_APP_ID}
      - JWT_ACCEPTED_AUDIENCES=jitsi

  prosody:
    image: jitsi/prosody:stable
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - ENABLE_AUTH=1
      - AUTH_TYPE=jwt
      - XMPP_DOMAIN=${JITSI_DOMAIN}
      - XMPP_AUTH_DOMAIN=auth.${JITSI_DOMAIN}
      - XMPP_GUEST_DOMAIN=guest.${JITSI_DOMAIN}
      - XMPP_MUC_DOMAIN=muc.${JITSI_DOMAIN}
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.${JITSI_DOMAIN}
      - JICOFO_COMPONENT_SECRET=${JICOFO_COMPONENT_SECRET}
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD}
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD}
      - JWT_APP_ID=${JITSI_APP_ID}
      - JWT_APP_SECRET=${JITSI_APP_SECRET}
      - JWT_ACCEPTED_ISSUERS=${JITSI_APP_ID}
      - JWT_ACCEPTED_AUDIENCES=jitsi
    volumes:
      - "${CONFIG:-./config}/prosody:/config"

  jicofo:
    image: jitsi/jicofo:stable
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - ENABLE_AUTH=1
      - AUTH_TYPE=jwt
      - XMPP_SERVER=prosody
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD}
      - JICOFO_COMPONENT_SECRET=${JICOFO_COMPONENT_SECRET}
      - JVB_BREWERY_MUC=jvbbrewery
      - XMPP_DOMAIN=${JITSI_DOMAIN}
      - XMPP_AUTH_DOMAIN=auth.${JITSI_DOMAIN}
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.${JITSI_DOMAIN}
      - JWT_APP_ID=${JITSI_APP_ID}
      - JWT_APP_SECRET=${JITSI_APP_SECRET}
      - JWT_ACCEPTED_ISSUERS=${JITSI_APP_ID}
      - JWT_ACCEPTED_AUDIENCES=jitsi
    volumes:
      - "${CONFIG:-./config}/jicofo:/config"

  jvb:
    image: jitsi/jvb:stable
    restart: unless-stopped
    ports:
      - "10000:10000/udp"
    environment:
      - TZ=${TZ:-UTC}
      - XMPP_SERVER=prosody
      - XMPP_PORT=5222
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD}
      - JVB_BREWERY_MUC=jvbbrewery
      - XMPP_DOMAIN=${JITSI_DOMAIN}
      - XMPP_AUTH_DOMAIN=auth.${JITSI_DOMAIN}
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.${JITSI_DOMAIN}
      - JVB_ADVERTISE_IPS=${JVB_ADVERTISE_IPS}
    volumes:
      - "${CONFIG:-./config}/jvb:/config"
